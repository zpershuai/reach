name: Verify Reach

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt && rustup default 1.96.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14.5'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/reach-rpc/package-lock.json
            packages/gateway-console/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm --prefix packages/reach-rpc ci --ignore-scripts
      - run: bash scripts/verify.sh
      - if: runner.os == 'macOS'
        run: bash scripts/package-engine.sh

  packaging:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install 1.96.0 --profile minimal --target x86_64-unknown-linux-musl && rustup default 1.96.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14.5'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: |
            packages/reach-rpc/package-lock.json
            packages/gateway-console/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: npm --prefix packages/reach-rpc ci --ignore-scripts
      - run: python3 scripts/verify-toolchain.py
      - run: bash scripts/verify-packaging.sh
