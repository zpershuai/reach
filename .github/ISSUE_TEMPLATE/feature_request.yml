name: Feature request
description: Propose a change in behavior or a new capability.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what stops you today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the behavior you want. Behavior changes are specified as an OpenSpec change before implementation (see CONTRIBUTING.md).
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security impact
      description: Does this change who can read, write or execute what? Use placeholder names only.
