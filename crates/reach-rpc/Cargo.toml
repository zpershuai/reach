[package]
name = "reach-rpc"
version = "0.1.0"
edition = "2021"

[dependencies]
regex = "1"
rustix = { version = "1", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
time = { version = "0.3", features = ["parsing", "formatting", "macros"] }
tungstenite = "0.26"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "engine"
path = "src/bin/engine.rs"

[[bin]]
name = "session-client"
path = "src/bin/session-client.rs"

[[bin]]
name = "roundtrip"
path = "src/bin/roundtrip.rs"
