[package]
name = "reach-rpc"
version = "0.3.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
regex = "1"
rustix = { version = "1", features = ["fs", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
time = { version = "0.3", features = ["parsing", "formatting", "macros"] }
tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "engine"
path = "src/bin/engine.rs"

[[bin]]
name = "session-client"
path = "src/bin/session-client.rs"

[[bin]]
name = "roundtrip"
path = "src/bin/roundtrip.rs"
