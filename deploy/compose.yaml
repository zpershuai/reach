services:
  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.gateway
    image: reach-gateway:current
    restart: unless-stopped
    env_file: gateway.env
    volumes:
      - ./engines.json:/run/reach/engines.json:ro
      - ./update:/run/reach/update:rw
    ports:
      - "127.0.0.1:28787:8787"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
